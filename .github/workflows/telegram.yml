name: Telegram Push Alert

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.0.0
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          format: html
          message: |
            ━━━━━━━━━━━━━━━━━━━━
             <b>Backend Push Alert</b>
            ━━━━━━━━━━━━━━━━━━━━
            <b>📦 Repository:</b> ${{ github.repository }}
            <b>🌿 Branch:</b> ${{ github.ref_name }}
            <b>👤 Author:</b> ${{ github.actor }}
            <b>💬 Commit:</b> <i>${{ github.event.head_commit.message }}</i>
            <b>✅ Status:</b> Push Successful
            ━━━━━━━━━━━━━━━━━━━━
